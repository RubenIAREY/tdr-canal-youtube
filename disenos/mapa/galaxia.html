<script>
  window.MODO = "galaxia";
  // paleta, letra y densidad antes de pintar (la URL manda sobre lo guardado)
  (function () { try {
    var q = new URLSearchParams(location.search), g = {};
    try { g = JSON.parse(localStorage.getItem("tdr-mapa-ajustes") || "{}") || {}; } catch (e) { g = {}; }
    var h = document.documentElement, ok = { paleta: ["noche", "asfalto", "papel"], letra: ["geist", "barlow"], densidad: ["compacta", "normal", "amplia"] };
    for (var k in ok) { var v = ok[k].indexOf(q.get(k)) >= 0 ? q.get(k) : g[k]; if (ok[k].indexOf(v) >= 0) h.setAttribute("data-" + k, v); }
  } catch (e) {} })();
</script>
